services:
  db:
    image: postgres:16-alpine
    container_name: kolega-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolega}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolega}
      POSTGRES_DB: ${POSTGRES_DB:-kolega}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolega}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
