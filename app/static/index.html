<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOLEGA</title>
  <style>
    :root {
      --bg: #fbfbfa;
      --card: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #ececec;
      --line-soft: #f3f3f3;
      --accent: #4f46e5;
      --accent-weak: #eef0fe;
      --ok: #15803d;
      --ok-bg: #f0fdf4;
      --err: #dc2626;
      --err-bg: #fef2f2;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(24,24,27,0.04), 0 12px 32px rgba(24,24,27,0.05);
    }
    /* Brand */
    .brand { padding: 34px 34px 0; text-align: center; }
    .brand .mark {
      font-size: 16px; font-weight: 700; letter-spacing: 0.28em;
      color: var(--ink); padding-left: 0.28em;
    }
    .brand .tag { color: var(--faint); font-size: 12.5px; margin-top: 8px; letter-spacing: 0.01em; }

    /* Tabs */
    .tabs { display: flex; gap: 28px; margin: 28px 34px 0; border-bottom: 1px solid var(--line); }
    .tabs button {
      appearance: none; background: none; border: 0; padding: 0 0 12px;
      font-size: 14px; font-weight: 500; color: var(--faint); cursor: pointer;
      position: relative; transition: color 0.15s;
    }
    .tabs button:hover { color: var(--muted); }
    .tabs button.active { color: var(--ink); font-weight: 600; }
    .tabs button.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 2px; background: var(--ink); border-radius: 2px;
    }

    /* Forms */
    form { padding: 24px 34px 34px; }
    label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted); margin: 18px 0 7px; }
    label:first-of-type { margin-top: 4px; }
    input {
      width: 100%; padding: 11px 13px; font-size: 14px; color: var(--ink);
      background: #fff; border: 1px solid var(--line); border-radius: 9px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: var(--faint); }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }

    /* Role picker */
    .role-pick { display: flex; gap: 10px; }
    .role-opt {
      flex: 1; text-align: left; cursor: pointer;
      padding: 12px 13px; border: 1px solid var(--line); border-radius: 11px;
      background: #fff; transition: border-color 0.15s, background 0.15s;
    }
    .role-opt:hover { border-color: #dcdce0; }
    .role-opt .role-title { display: block; font-size: 13.5px; font-weight: 600; color: var(--muted); }
    .role-opt .role-desc { display: block; font-size: 11.5px; color: var(--faint); margin-top: 2px; }
    .role-opt.active { border-color: var(--accent); background: var(--accent-weak); }
    .role-opt.active .role-title { color: var(--accent); }
    .role-opt.active .role-desc { color: #6d68d6; }

    /* Button */
    .btn {
      width: 100%; margin-top: 26px; padding: 12px; border: 0; border-radius: 9px;
      background: var(--ink); color: #fff; font-size: 14.5px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s, transform 0.05s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: translateY(1px); }

    .msg { margin-top: 16px; font-size: 13px; text-align: center; min-height: 18px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .hidden { display: none; }

    /* Profile */
    .profile { padding: 32px 34px 34px; }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 600; color: #fff; background: var(--accent);
    }
    .profile h2 { text-align: center; margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
    .profile .email { text-align: center; color: var(--muted); font-size: 13px; margin-top: 3px; }
    .rows { margin-top: 24px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .row { display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px; font-size: 14px; border-bottom: 1px solid var(--line-soft); }
    .row:last-child { border-bottom: 0; }
    .row .k { color: var(--muted); }
    .row .v { color: var(--ink); font-weight: 500; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; }
    .badge.on { background: var(--ok-bg); color: var(--ok); }
    .badge.off { background: #f4f4f5; color: var(--muted); }
    .logout {
      width: 100%; margin-top: 22px; padding: 11px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); border-radius: 9px; font-size: 14px;
      font-weight: 500; cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .logout:hover { border-color: #f1c4c4; color: var(--err); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">KOLEGA</div>
      <div class="tag">Kolaborasi Layanan Ekonomi &amp; Geliat Warga</div>
    </div>

    <!-- Auth view -->
    <div id="auth-view">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="switchTab('login')">Masuk</button>
        <button id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>

      <form id="login-form" onsubmit="return doLogin(event)">
        <label for="login-username">Username</label>
        <input id="login-username" placeholder="budi_las" autocomplete="username" required />
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        <button class="btn" type="submit">Masuk</button>
        <div id="login-msg" class="msg"></div>
      </form>

      <form id="register-form" class="hidden" onsubmit="return doRegister(event)">
        <label>Daftar sebagai</label>
        <div class="role-pick">
          <button type="button" class="role-opt active" data-role="customer" onclick="pickRole(this)">
            <span class="role-title">Warga</span>
            <span class="role-desc">Cari jasa</span>
          </button>
          <button type="button" class="role-opt" data-role="provider" onclick="pickRole(this)">
            <span class="role-title">Penyedia</span>
            <span class="role-desc">Tawarkan jasa</span>
          </button>
        </div>
        <label for="reg-username">Username</label>
        <input id="reg-username" placeholder="budi_las" minlength="3" maxlength="50" required />
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="budi@email.com" required />
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" placeholder="Minimal 8 karakter" minlength="8" required />
        <button class="btn" type="submit">Buat akun</button>
        <div id="register-msg" class="msg"></div>
      </form>
    </div>

    <!-- Profile view -->
    <div id="profile-view" class="profile hidden">
      <div class="avatar" id="p-avatar">?</div>
      <h2 id="p-username">—</h2>
      <div class="email" id="p-email">—</div>
      <div class="rows">
        <div class="row"><span class="k">ID</span><span class="v" id="p-id">—</span></div>
        <div class="row"><span class="k">Peran</span><span id="p-role"></span></div>
        <div class="row"><span class="k">Verifikasi</span><span id="p-verified"></span></div>
        <div class="row"><span class="k">Status</span><span id="p-active"></span></div>
        <div class="row"><span class="k">Bergabung</span><span class="v" id="p-created">—</span></div>
      </div>
      <button class="logout" onclick="logout()">Keluar</button>
    </div>
  </div>

  <script>
    const API = "/api/v1/auth";
    const TOKEN_KEY = "kolega_token";
    const ROLE_LABELS = { customer: "Warga", provider: "Penyedia", admin: "Pengelola" };

    let selectedRole = "customer";
    function pickRole(btn) {
      selectedRole = btn.dataset.role;
      document.querySelectorAll(".role-opt").forEach((b) => b.classList.toggle("active", b === btn));
    }

    function switchTab(which) {
      const login = which === "login";
      document.getElementById("tab-login").classList.toggle("active", login);
      document.getElementById("tab-register").classList.toggle("active", !login);
      document.getElementById("login-form").classList.toggle("hidden", !login);
      document.getElementById("register-form").classList.toggle("hidden", login);
    }

    function setMsg(id, text, ok) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = "msg " + (ok ? "ok" : "err");
    }

    async function doRegister(e) {
      e.preventDefault();
      const body = {
        username: document.getElementById("reg-username").value.trim(),
        email: document.getElementById("reg-email").value.trim(),
        password: document.getElementById("reg-password").value,
        role: selectedRole,
      };
      const res = await fetch(`${API}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        setMsg("register-msg", "Akun dibuat! Silakan masuk.", true);
        setTimeout(() => switchTab("login"), 900);
      } else {
        setMsg("register-msg", errText(data) || "Gagal mendaftar", false);
      }
      return false;
    }

    async function doLogin(e) {
      e.preventDefault();
      const form = new URLSearchParams();
      form.set("username", document.getElementById("login-username").value.trim());
      form.set("password", document.getElementById("login-password").value);
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form,
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        localStorage.setItem(TOKEN_KEY, data.access_token);
        await loadProfile();
      } else {
        setMsg("login-msg", errText(data) || "Login gagal", false);
      }
      return false;
    }

    async function loadProfile() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return showAuth();
      const res = await fetch(`${API}/me`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) { localStorage.removeItem(TOKEN_KEY); return showAuth(); }
      const u = await res.json();
      document.getElementById("p-avatar").textContent = (u.username[0] || "?").toUpperCase();
      document.getElementById("p-username").textContent = u.username;
      document.getElementById("p-email").textContent = u.email;
      document.getElementById("p-id").textContent = "#" + u.id;
      document.getElementById("p-role").innerHTML =
        `<span class="badge ${u.role === "admin" ? "on" : "off"}">${ROLE_LABELS[u.role] || u.role}</span>`;
      document.getElementById("p-verified").innerHTML = u.is_verified
        ? '<span class="badge on">Terverifikasi</span>' : '<span class="badge off">Belum</span>';
      document.getElementById("p-active").innerHTML = u.is_active
        ? '<span class="badge on">Aktif</span>' : '<span class="badge off">Nonaktif</span>';
      document.getElementById("p-created").textContent =
        new Date(u.created_at).toLocaleDateString("id-ID", { year: "numeric", month: "short", day: "numeric" });
      document.getElementById("auth-view").classList.add("hidden");
      document.getElementById("profile-view").classList.remove("hidden");
    }

    function showAuth() {
      document.getElementById("profile-view").classList.add("hidden");
      document.getElementById("auth-view").classList.remove("hidden");
    }

    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      showAuth();
    }

    function errText(data) {
      if (!data || !data.detail) return null;
      if (typeof data.detail === "string") return data.detail;
      if (Array.isArray(data.detail)) return data.detail[0]?.msg || null;
      return null;
    }

    if (localStorage.getItem(TOKEN_KEY)) loadProfile();
  </script>
</body>
</html>
