<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yorozuya</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-2: #1f2330;
      --border: #2a2f3d;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #6ea8fe;
      --accent-2: #8b5cf6;
      --ok: #34d399;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2030 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .brand {
      padding: 28px 28px 8px;
      text-align: center;
    }
    .brand .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand .tag { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .tabs {
      display: flex;
      margin: 18px 28px 0;
      background: var(--panel-2);
      border-radius: 10px;
      padding: 4px;
    }
    .tabs button {
      flex: 1;
      padding: 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tabs button.active {
      background: var(--accent);
      color: #0b1020;
    }
    form { padding: 20px 28px 28px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border 0.15s;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #0b1020;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 13px; text-align: center; min-height: 18px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .hidden { display: none; }
    /* Profile */
    .profile { padding: 24px 28px 28px; }
    .avatar {
      width: 64px; height: 64px; border-radius: 50%;
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #0b1020;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .profile h2 { text-align: center; margin: 0; font-size: 20px; }
    .profile .email { text-align: center; color: var(--muted); font-size: 13px; margin-top: 2px; }
    .rows { margin-top: 20px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .row {
      display: flex; justify-content: space-between;
      padding: 12px 16px; font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: 0; }
    .row .k { color: var(--muted); }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }
    .badge.on { background: rgba(52,211,153,0.15); color: var(--ok); }
    .badge.off { background: rgba(154,163,178,0.15); color: var(--muted); }
    .logout {
      width: 100%; margin-top: 20px; padding: 12px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; cursor: pointer; font-weight: 600;
    }
    .logout:hover { border-color: var(--err); color: var(--err); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">万事屋 Yorozuya</div>
      <div class="tag">We do anything — masuk untuk mulai</div>
    </div>

    <!-- Auth view -->
    <div id="auth-view">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="switchTab('login')">Masuk</button>
        <button id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>

      <form id="login-form" onsubmit="return doLogin(event)">
        <label for="login-username">Username</label>
        <input id="login-username" autocomplete="username" required />
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required />
        <button class="btn" type="submit">Masuk</button>
        <div id="login-msg" class="msg"></div>
      </form>

      <form id="register-form" class="hidden" onsubmit="return doRegister(event)">
        <label for="reg-username">Username</label>
        <input id="reg-username" minlength="3" maxlength="50" required />
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" required />
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" minlength="8" required />
        <button class="btn" type="submit">Buat akun</button>
        <div id="register-msg" class="msg"></div>
      </form>
    </div>

    <!-- Profile view -->
    <div id="profile-view" class="profile hidden">
      <div class="avatar" id="p-avatar">?</div>
      <h2 id="p-username">—</h2>
      <div class="email" id="p-email">—</div>
      <div class="rows">
        <div class="row"><span class="k">ID</span><span id="p-id">—</span></div>
        <div class="row"><span class="k">Status</span><span id="p-active"></span></div>
        <div class="row"><span class="k">Role</span><span id="p-role"></span></div>
        <div class="row"><span class="k">Bergabung</span><span id="p-created">—</span></div>
      </div>
      <button class="logout" onclick="logout()">Keluar</button>
    </div>
  </div>

  <script>
    const API = "/api/v1/auth";
    const TOKEN_KEY = "yorozuya_token";

    function switchTab(which) {
      const login = which === "login";
      document.getElementById("tab-login").classList.toggle("active", login);
      document.getElementById("tab-register").classList.toggle("active", !login);
      document.getElementById("login-form").classList.toggle("hidden", !login);
      document.getElementById("register-form").classList.toggle("hidden", login);
    }

    function setMsg(id, text, ok) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = "msg " + (ok ? "ok" : "err");
    }

    async function doRegister(e) {
      e.preventDefault();
      const body = {
        username: document.getElementById("reg-username").value.trim(),
        email: document.getElementById("reg-email").value.trim(),
        password: document.getElementById("reg-password").value,
      };
      const res = await fetch(`${API}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        setMsg("register-msg", "Akun dibuat! Silakan masuk.", true);
        setTimeout(() => switchTab("login"), 900);
      } else {
        setMsg("register-msg", errText(data) || "Gagal mendaftar", false);
      }
      return false;
    }

    async function doLogin(e) {
      e.preventDefault();
      const form = new URLSearchParams();
      form.set("username", document.getElementById("login-username").value.trim());
      form.set("password", document.getElementById("login-password").value);
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form,
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        localStorage.setItem(TOKEN_KEY, data.access_token);
        await loadProfile();
      } else {
        setMsg("login-msg", errText(data) || "Login gagal", false);
      }
      return false;
    }

    async function loadProfile() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return showAuth();
      const res = await fetch(`${API}/me`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) { localStorage.removeItem(TOKEN_KEY); return showAuth(); }
      const u = await res.json();
      document.getElementById("p-avatar").textContent = (u.username[0] || "?").toUpperCase();
      document.getElementById("p-username").textContent = u.username;
      document.getElementById("p-email").textContent = u.email;
      document.getElementById("p-id").textContent = "#" + u.id;
      document.getElementById("p-active").innerHTML = u.is_active
        ? '<span class="badge on">Aktif</span>' : '<span class="badge off">Nonaktif</span>';
      document.getElementById("p-role").innerHTML = u.is_superuser
        ? '<span class="badge on">Admin</span>' : '<span class="badge off">User</span>';
      document.getElementById("p-created").textContent =
        new Date(u.created_at).toLocaleDateString("id-ID", { year: "numeric", month: "short", day: "numeric" });
      document.getElementById("auth-view").classList.add("hidden");
      document.getElementById("profile-view").classList.remove("hidden");
    }

    function showAuth() {
      document.getElementById("profile-view").classList.add("hidden");
      document.getElementById("auth-view").classList.remove("hidden");
    }

    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      showAuth();
    }

    function errText(data) {
      if (!data || !data.detail) return null;
      if (typeof data.detail === "string") return data.detail;
      if (Array.isArray(data.detail)) return data.detail[0]?.msg || null;
      return null;
    }

    // Restore session on load
    if (localStorage.getItem(TOKEN_KEY)) loadProfile();
  </script>
</body>
</html>
